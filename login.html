<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in</title><link rel="stylesheet" href="css/style.css"></head>
<body><div class="authwrap"><form class="authbox" id="authForm" data-mode="login">
<h2>Log in</h2><p>Welcome back.</p>
<label>Email<input name="email" type="email" required autocomplete="email"></label>
<label>Password<input name="password" type="password" minlength="6" required autocomplete="current-password"></label>
<button type="submit">Log in</button><div class="msg" id="msg" role="alert"></div>
<div class="alt">New here? <a href="register.html">Create account</a></div></form></div><script type="module" src="js/auth.js"></script></body></html>
